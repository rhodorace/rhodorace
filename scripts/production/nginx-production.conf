server {
    listen 80;
    listen [::]:80;
    server_name rhodo-rock.com www.rhodo-rock.com;
    server_tokens off;
    include /etc/rhodo-production/prepared/nginx-acme-http.conf;
    location / { return 308 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name rhodo-rock.com www.rhodo-rock.com;
    ssl_certificate /etc/rhodo-production/acme/live/rhodo-production/fullchain.pem;
    ssl_certificate_key /etc/rhodo-production/acme/live/rhodo-production/privkey.pem;
    include /etc/nginx/snippets/rhodo-public-common.conf;
}
