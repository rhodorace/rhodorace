# Localhost only. Public activation requires a separately reviewed configuration.
server {
    listen 127.0.0.1:8443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
    return 444;
}
server {
    listen 127.0.0.1:8443 ssl;
    server_name rhodo-rock.com;
    ssl_certificate /etc/rhodo-production/tls/rhodo-rock.com/fullchain.pem;
    ssl_certificate_key /etc/rhodo-production/tls/rhodo-rock.com/privkey.pem;
    include /etc/nginx/snippets/rhodo-private-common.conf;
}
server {
    listen 127.0.0.1:8443 ssl;
    server_name www.rhodo-rock.com;
    ssl_certificate /etc/rhodo-production/tls/www.rhodo-rock.com/fullchain.pem;
    ssl_certificate_key /etc/rhodo-production/tls/www.rhodo-rock.com/privkey.pem;
    include /etc/nginx/snippets/rhodo-private-common.conf;
}
