# Include only inside each public Rhodo HTTP server after separately approved cutover.
# This template is prepared, not enabled by the private-preview setup.
location ^~ /.well-known/acme-challenge/ {
    root /var/www/rhodo-acme;
    try_files $uri =404;
    default_type text/plain;
    add_header Cache-Control no-store;
    limit_except GET HEAD { deny all; }
}
