server_tokens off;
http2 on;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_session_cache shared:RHODO_PUBLIC:1m;
ssl_session_timeout 1d;
ssl_session_tickets off;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
include /etc/nginx/snippets/rhodo-public-headers.conf;
access_log /var/log/nginx/rhodo-access.log;
error_log /var/log/nginx/rhodo-error.log warn;
gzip on;
gzip_vary on;
gzip_types text/plain text/css application/javascript application/json image/svg+xml application/gpx+xml;
include /etc/rhodo-production/prepared/nginx-acme-http.conf;
location ~ (^|/)\. { return 404; }
location ^~ /_next/static/ {
    alias /srv/rhodo-rock/current/.next/static/;
    expires off;
    include /etc/nginx/snippets/rhodo-public-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
}
location ~* \.(?:png|jpe?g|gif|svg|webp|ico|mp4|woff2?|gpx)$ {
    root /srv/rhodo-rock/current/public;
    try_files $uri =404;
    expires 1h;
}
location ^~ /locales/ {
    root /srv/rhodo-rock/current/public;
    try_files $uri =404;
    expires 5m;
}
location / {
    proxy_pass http://127.0.0.1:3002;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection '';
    proxy_hide_header X-Powered-By;
    proxy_connect_timeout 3s;
    proxy_read_timeout 60s;
}
