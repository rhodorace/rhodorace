server_tokens off;
http2 on;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_session_cache shared:RHODO_PREVIEW:1m;
ssl_session_timeout 1d;
ssl_session_tickets off;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Permissions-Policy 'camera=(), microphone=(), geolocation=()' always;
# Preview-only: prevent Rhodo analytics/pixel traffic, permit the actual read-only integrations.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; connect-src 'self' https://www.googleapis.com; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; frame-src https://tracedetrail.fr https://www.irun.bg; media-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'none'" always;
add_header X-Robots-Tag 'noindex, nofollow' always;
access_log /var/log/nginx/rhodo-private-access.log;
error_log /var/log/nginx/rhodo-private-error.log warn;
gzip on;
gzip_vary on;
gzip_types text/plain text/css application/javascript application/json image/svg+xml application/gpx+xml;
location ~ (^|/)\. { return 404; }
location ^~ /_next/static/ {
    alias /srv/rhodo-rock/current/.next/static/;
    expires off;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
    access_log off;
}
location ~* \.(?:png|jpe?g|gif|svg|webp|ico|mp4|woff2?|gpx)$ {
    root /srv/rhodo-rock/current/public;
    try_files $uri =404;
    expires 1h;
}
location ^~ /locales/ {
    root /srv/rhodo-rock/current/public;
    try_files $uri =404;
    expires 5m;
}
location / {
    proxy_pass http://127.0.0.1:3002;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection '';
    proxy_hide_header X-Powered-By;
    proxy_connect_timeout 3s;
    proxy_read_timeout 60s;
}
